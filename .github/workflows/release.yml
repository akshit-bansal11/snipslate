name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Quality gate
        shell: pwsh
        run: ./scripts/check.ps1 -Ci

      - name: Publish, rename, checksum
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          dotnet publish src/Snipslate/Snipslate.csproj -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:Version=$version -o out
          if ($LASTEXITCODE -ne 0) { throw "publish failed" }
          $exe = "Snipslate-$version.exe"
          Move-Item out/Snipslate.exe "out/$exe"
          $hash = (Get-FileHash "out/$exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("out/SHA256SUMS.txt", "$hash  $exe`n")
          "EXE=out/$exe" >> $env:GITHUB_ENV

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:TAG $env:EXE out/SHA256SUMS.txt --verify-tag --title "Snipslate $($env:TAG.TrimStart('v'))" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
