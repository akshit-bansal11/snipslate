name: Screenshots

# Renders the real windows on CI runners so a design change can be reviewed without
# running the app locally. Linux (Xvfb, Mesa llvmpipe) shows the dark theme, which is
# egui's fallback when no OS theme is reported; the macOS runner shows the light theme.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install build and display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libclang-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libxcb1-dev libxcb-shm0-dev libxcb-randr0-dev libxcb-xfixes0-dev libxrandr-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libxcursor-dev libxi-dev libdbus-1-dev libpipewire-0.3-dev libgbm-dev libwayland-dev libegl-dev libgl1-mesa-dev \
            xvfb xdotool imagemagick libgl1-mesa-dri fonts-noto-core fonts-dejavu-core openbox x11-xserver-utils tesseract-ocr gnome-keyring dbus-x11 fonts-noto-cjk

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build
        run: cargo build --release --locked

      - name: Capture windows
        run: |
          mkdir shots
          cat > capture.sh <<'EOF'
          set -u
          exe=./target/release/snipslate
          # A window manager honours fullscreen and placement as a real desktop does;
          # the coloured root gives the overlay something to dim.
          openbox >/dev/null 2>&1 &
          sleep 2
          # A French notice on the desktop gives the snip something real to read.
          convert -size 1280x800 xc:'#e2e8f0' -fill '#ffffff' -draw 'roundrectangle 140,170 1140,560 18,18' \
            -font DejaVu-Sans-Bold -fill '#0f172a' -pointsize 34 -annotate +200+260 'Mise à jour disponible' \
            -font DejaVu-Sans -pointsize 24 -fill '#334155' \
            -annotate +200+320 "Une nouvelle version de l'application est prête." \
            -annotate +200+362 "Elle sera installée au prochain redémarrage." \
            -annotate +200+404 "Enregistrez votre travail avant de continuer." \
            -fill '#2563eb' -draw 'roundrectangle 200,460 540,516 10,10' \
            -fill '#ffffff' -pointsize 22 -annotate +238+496 'Redémarrer maintenant' \
            desktop.png
          display -window root desktop.png
          # An unlocked keyring gives Settings a Secret Service, as on a real desktop.
          eval "$(dbus-launch --sh-syntax)"
          printf "" | gnome-keyring-daemon --unlock --components=secrets >/dev/null 2>&1
          eval "$(printf "" | gnome-keyring-daemon --start --components=secrets 2>/dev/null)"
          export GNOME_KEYRING_CONTROL SSH_AUTH_SOCK

          $exe --settings & pid=$!
          sleep 6; import -window root shots/linux-settings.png
          wid=$(xdotool search --name '^Snipslate settings$' | head -1)
          [ -n "$wid" ] && import -window "$wid" shots/window-settings.png
          kill $pid; wait $pid 2>/dev/null

          $exe --message "Hotkey unavailable" "Ctrl+Alt+T is already used by another app. Pick another in Settings; the tray menu still works." & pid=$!
          sleep 5; import -window root shots/linux-message.png; kill $pid; wait $pid 2>/dev/null

          # Script rendering check: the message window loads the same fallback fonts as the
          # result window. Four lines per window fit without scrolling.
          i=0
          while IFS= read -r sample; do
            i=$((i+1))
            $exe --message "Scripts $i" "$(printf '%b' "$sample")" & pid=$!
            sleep 4
            wid=$(xdotool search --name "^Scripts $i\$" | head -1)
            [ -n "$wid" ] && import -window "$wid" "shots/scripts-$i.png"
            kill $pid; wait $pid 2>/dev/null
          done <<'SAMPLES'
          مرحبا بالعالم\nسلام دنیا\nخوش آمدید\nשלום עולם
          नमस्ते दुनिया\nনমস্কার বিশ্ব\nவணக்கம் உலகம்\nనమస్కారం ప్రపంచం
          สวัสดีชาวโลก\n你好，世界\nこんにちは世界\n안녕하세요 세계
          Γειά σου Κόσμε\nПривет, мир\nSnipslate 2.0 هو تطبيق\nשלום Snipslate 2.0 עולם
          SAMPLES

          # Overlay idle and mid-drag over the notice, then the copy toast (Tesseract reads it).
          $exe --copy & pid=$!
          sleep 5; import -window root shots/linux-overlay-idle.png
          xdotool mousemove 180 215 mousedown 1 mousemove 600 330 mousemove 1110 430
          sleep 1; import -window root shots/linux-overlay-drag.png
          xdotool mouseup 1
          # The toast closes itself after 1.5 s, so take a quick burst.
          for i in 1 2 3 4 5 6 7 8; do sleep 0.4; import -window root "shots/linux-copy-$i.png"; done
          kill $pid 2>/dev/null; wait $pid 2>/dev/null
          exit 0
          EOF
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x800x24" bash capture.sh

      - uses: actions/upload-artifact@v7
        with:
          name: screenshots-linux
          path: shots/*.png
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build
        run: cargo build --release --locked

      - name: Capture windows
        run: |
          set -u
          mkdir shots
          exe=./target/release/snipslate
          $exe --settings & pid=$!
          sleep 6; screencapture -x shots/macos-settings.png; kill $pid || true

          $exe --message "Snipslate" "Snipslate is already running. Look for its icon in the menu bar." & pid=$!
          sleep 5; screencapture -x shots/macos-message.png; kill $pid || true

      - uses: actions/upload-artifact@v7
        with:
          name: screenshots-macos
          path: shots/*.png
          if-no-files-found: error
