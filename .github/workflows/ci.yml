name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Quality gate
        shell: pwsh
        run: ./scripts/check.ps1 -Ci

      - name: Publish single-file exe
        shell: pwsh
        run: >-
          dotnet publish src/Snipslate/Snipslate.csproj -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o out

      - uses: actions/upload-artifact@v7
        with:
          name: Snipslate-win-x64
          path: out/Snipslate.exe
          if-no-files-found: error
