name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['site/**', '.github/workflows/site.yml', '.github/workflows/screenshots.yml']
  pull_request:
    paths-ignore: ['site/**', '.github/workflows/site.yml', '.github/workflows/screenshots.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libclang-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libxcb1-dev libxcb-shm0-dev libxcb-randr0-dev libxcb-xfixes0-dev libxrandr-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libxcursor-dev libxi-dev libdbus-1-dev libpipewire-0.3-dev libgbm-dev libwayland-dev libegl-dev libgl1-mesa-dev

      - name: Rust components
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Quality gate
        shell: pwsh
        run: ./scripts/check.ps1 -Ci

      - name: Build release binary
        run: cargo build --release --locked

      # The tray process is what stays resident, so its idle memory is the number that matters.
      # Windows and macOS runners have a desktop session; Linux would need Xvfb + a tray host.
      - name: Measure idle memory of the tray process
        if: runner.os != 'Linux'
        shell: pwsh
        run: |
          $exe = if ($IsWindows) { 'target/release/snipslate.exe' } else { 'target/release/snipslate' }
          $p = Start-Process $exe -PassThru
          Start-Sleep -Seconds 10
          $p.Refresh()
          if ($p.HasExited) { throw "tray process exited early with code $($p.ExitCode)" }
          $ws = [math]::Round($p.WorkingSet64 / 1MB, 1)
          if ($IsWindows) {
            $priv = [math]::Round($p.PrivateMemorySize64 / 1MB, 1)
            "Tray idle on Windows: working set $ws MB, private $priv MB" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          } else {
            # RSS on macOS counts shared AppKit pages; phys_footprint is what Activity Monitor calls Memory.
            $fp = (footprint $p.Id 2>&1 | Select-String -Pattern 'phys_footprint:' | Select-Object -First 1)
            "Tray idle on macOS: RSS $ws MB, $fp" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          }
          Stop-Process -Id $p.Id
          # ponytail: Windows-only budget, about 2x the first measured 11.9 MB; add one for macOS once footprint has a baseline.
          if ($IsWindows -and $ws -gt 25) { throw "tray idle working set $ws MB is over the 25 MB budget" }

      - uses: actions/upload-artifact@v7
        with:
          name: snipslate-${{ runner.os }}
          path: |
            target/release/snipslate
            target/release/snipslate.exe
          if-no-files-found: error
