name: Site

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # npm ci once a lockfile is committed; until then, install and publish the lockfile it wrote.
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Quality gate (non-mutating)
        run: npm run check:ci

      - name: Build
        run: npm run build

      - name: Upload the generated lockfile
        if: hashFiles('site/package-lock.json') != '' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: site-package-lock
          path: site/package-lock.json
