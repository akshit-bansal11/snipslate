[package]
name = "snipslate"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Snip any part of the screen to copy its text or translate it with AI"
license = "MIT"

[[bin]]
name = "snipslate"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "accesskit", "clipboard", "x11", "wayland"] }
tray-icon = "0.26.1"
global-hotkey = "0.9.0"
xcap = "0.9.8"
# Same semver line (0.25) as xcap's own `image` dependency, so RgbaImage unifies.
image = { version = "0.25.10", default-features = false, features = ["png"] }
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
base64 = "0.23.1"
# Default `v1` feature = native stores on Windows/macOS and the pure-Rust-crypto Secret Service store on Linux.
keyring = "4.2.0"
mouse_position = "0.1.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Foundation",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_WinRT",
    "Win32_UI_HiDpi",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSError",
    "NSEnumerator",
    "NSObject",
    "NSString",
] }
objc2-vision = { version = "0.3.2", default-features = false, features = [
    "std",
    "VNObservation",
    "VNRecognizeTextRequest",
    "VNRequest",
    "VNRequestHandler",
    "VNTypes",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Same 0.18 line tray-icon's libappindicator/muda stack uses (gtk::init before the tray).
gtk = "0.18"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3
